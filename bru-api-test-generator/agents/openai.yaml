interface:
  display_name: "bru-api-test-generator"
  short_description: "Generate modular Bruno HTTP tests from offline Swagger"
  default_prompt: "Use $bru-api-test-generator to locate or acquire the local Swagger/OpenAPI contract (probing an already-running loopback app only when no file exists), partition tagged operations and explicitly mapped untagged operations with isolated parameters/definitions/responses, preserve Chinese business names and comments while keeping stable machine IDs, generate contracts/README.md plus one CASES.md per module with a title, short description, and Mermaid swimlane for every case, generate reviewable Bruno drafts for JSON/text/XML/form/multipart payloads whose requests use the pre-request mode selected by request-auth.yaml and environment-based BASE_URL, run the runtime preflight with optional public/admin probes and strict offline-OpenAPI reconciliation, require flows only when explicitly declared, validate cleanup evidence, and report draft/runnable/verified/blocked status without claiming completion before execution evidence."
