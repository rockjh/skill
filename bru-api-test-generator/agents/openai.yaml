interface:
  display_name: "bru-api-test-generator"
  short_description: "Generate modular Bruno HTTP tests from offline Swagger"
  default_prompt: "Use $bru-api-test-generator to build deterministic Bruno API tests from an offline OpenAPI contract. Partition by the original OpenAPI Tag, require primary_tag for multi-Tag operations, keep stable English case IDs in manifests and meta.name, and name requests with a stable sequence plus Chinese case.title. Use execution/config.yaml as the only shared runtime configuration, inject authentication and common Headers from collection.bru, materialize centrally, reconcile exact request and assertion content, require a representative runtime route probe, and report draft/runnable/verified/blocked without presenting module evidence as global completion."
