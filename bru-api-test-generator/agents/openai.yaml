interface:
  display_name: "bru-api-test-generator"
  short_description: "Generate modular Bruno HTTP tests from offline Swagger"
  default_prompt: "Use $bru-api-test-generator to initialize or incrementally generate deterministic Bruno API tests from an offline OpenAPI contract. Partition by the original Tag, preserve stable English IDs, derive business-readable Chinese titles and filenames, infer scenario matrices, and enhance draft logic from source evidence. Keep execution/config.yaml limited to active_environment and sign; parse common Headers from the active environment and inject them through collection.bru. Default execution to read-only, require explicit confirmations for writes/destructive/external effects, verify project scripts or shared CLI mode plus generation/QA locks, and reconcile structured requests, exact assertions, source gaps, preflight, and execution evidence before reporting verified."
