[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bruno-api-test-generator"
version = "5.2.0"
description = "Reusable Bruno API QA generation and execution CLI"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.scripts]
bruno-api-test-generator = "bruno_api_test_generator:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = [
  "analyze_java_logic",
  "analyze_source_logic",
  "check_api_coverage",
  "check_artifact_safety",
  "check_version_compatibility",
  "command_execution",
  "execution_config",
  "fetch_local_openapi",
  "manifest_io",
  "materialize_missing_bru",
  "bruno_api_test_generator",
  "normalize_bruno_report",
  "parse_openapi",
  "qa_constraints",
  "qa_lock",
  "run_bruno",
  "runtime_preflight",
  "scripts_manager",
  "source_constraints",
  "tool_version",
  "validate_flow_execution",
]
