# Bruno 请求认证配置模板。
# 以 _env 结尾的值是 Bruno 环境变量名，不能填写真实密钥。
# 只能启用一种模式；`seres.sign` 是 `seres-sign` 的兼容别名。
version: 1
mode: seres-sign
seres-sign: true
# seres.sign: true
base_url_env: BASE_URL
modes:
  seres-sign:
    enabled: true
    algorithm: SHA256
    secret_key_env: SECRET_KEY
    access_key_env: ACCESS_KEY
    signature:
      parameters:
        # request.path 仅签名路径；request.url 签名解析后的完整 URL。
        url: request.path
        body: request.body
        query: request.query
        timestamp: timestamp
        secret_key_env: SECRET_KEY
        access_key_env: ACCESS_KEY
      append_secret: true
    headers:
      sign: sign
      timestamp: timestamp
      accesskey: accesskey
    extra_headers:
      # 自定义 Header 的值也从环境变量读取。
      # X-Tenant-Id: TENANT_ID
      # X-Service-Token:
      #   env: SERVICE_TOKEN
      #   prefix: Bearer
  bearer:
    enabled: false
    token_env: ACCESS_TOKEN
    header: Authorization
    prefix: Bearer
  # OAuth2 的 token 获取流程可由项目自己的 bootstrap/preflight 完成；
  # Bruno 请求只读取刷新后的环境变量，不把 client secret 写入用例。
  oauth2:
    enabled: false
    token_env: ACCESS_TOKEN
    header: Authorization
    prefix: Bearer
    # token_url: https://...  # 仅作为文档配置，不在用例中自动发送凭据。
  cookie:
    enabled: false
    cookie_env: SESSION_COOKIE
    header: Cookie
  api-key:
    enabled: false
    token_env: API_KEY
    header: X-API-Key
  custom:
    enabled: false
    headers:
      # X-Service-Token: SERVICE_TOKEN
      # X-Tenant-Token:
      #   env: TENANT_TOKEN
      #   prefix: Bearer
