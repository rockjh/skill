[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dltk"
version = "7.0.0"
description = "Unified development lifecycle toolkit"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "pytest>=8"]

[project.scripts]
dltk = "dltk.cli:console_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dltk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
